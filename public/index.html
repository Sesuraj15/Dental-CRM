<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DentaDesk — Dental Clinic CRM, ERP & AI Copilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
      --bg: #f8fafc;
      --card: #ffffff;
      --card-subtle: #f1f5f9;
      --tx: #0f172a;
      --tx-dim: #475569;
      --tx-muted: #64748b;
      --bd: #e2e8f0;
      --bd-subtle: #edf2f7;
      --ac: #0d9488;
      --ac-hover: #0f766e;
      --ac-light: #ccfbf1;
      --ac-dim: #f0fdfa;
      --cyan: #06b6d4;
      --cyan-light: #cffafe;
      --wa-green: #22c55e;
      --wa-light: #dcfce7;
      --amber: #f59e0b;
      --amber-light: #fef3c7;
      --rose: #ef4444;
      --rose-light: #fee2e2;
      --indigo: #6366f1;
      --indigo-light: #e0e7ff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --radius: 12px;
      --radius-sm: 8px;
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --card: #111827;
      --card-subtle: #1e293b;
      --tx: #f8fafc;
      --tx-dim: #cbd5e1;
      --tx-muted: #94a3b8;
      --bd: #1e293b;
      --bd-subtle: #172033;
      --ac: #14b8a6;
      --ac-hover: #2dd4bf;
      --ac-light: #134e4a;
      --ac-dim: #042f2e;
      --cyan-light: #164e63;
      --wa-light: #14532d;
      --amber-light: #78350f;
      --rose-light: #7f1d1d;
      --indigo-light: #312e81;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: var(--font-main);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--bd);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--ac), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
    }

    .brand-info h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--tx);
      margin: 0;
      line-height: 1.2;
    }

    .brand-info span {
      font-size: 12px;
      color: var(--tx-muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-live {
      background: var(--wa-light);
      color: var(--wa-green);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-dry {
      background: var(--amber-light);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Navigation Bar */
    nav {
      background: var(--card);
      border-bottom: 1px solid var(--bd);
      padding: 6px 24px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    nav button {
      background: transparent;
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      color: var(--tx-dim);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    nav button:hover {
      background: var(--card-subtle);
      color: var(--tx);
    }

    nav button.active {
      background: var(--ac-light);
      color: var(--ac);
    }

    nav button .badge {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--ac);
      color: #fff;
    }

    /* Layout Containers */
    main {
      max-width: 1320px;
      margin: 20px auto;
      padding: 0 20px 60px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-4 {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }

    .grid-2 {
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--tx);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* KPI Stat Cards */
    .kpi-card {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--ac);
      opacity: 0.8;
    }

    .kpi-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--tx-muted);
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--tx);
      line-height: 1.2;
      margin: 4px 0;
    }

    .kpi-sub {
      font-size: 12px;
      color: var(--tx-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Interactive Elements & Buttons */
    button.btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button.btn:hover {
      background: var(--card-subtle);
      border-color: var(--tx-muted);
    }

    button.btn-primary {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.25);
    }

    button.btn-primary:hover {
      background: var(--ac-hover);
      border-color: var(--ac-hover);
    }

    button.btn-cyan {
      background: var(--cyan);
      color: #fff;
      border-color: var(--cyan);
    }

    button.btn-danger {
      background: var(--rose-light);
      color: var(--rose);
      border-color: var(--rose-light);
    }

    button.btn-danger:hover {
      background: var(--rose);
      color: #fff;
    }

    button.btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      width: 100%;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 3px var(--ac-light);
    }

    /* Badges & Tags */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .tag-teal {
      background: var(--ac-light);
      color: var(--ac);
    }

    .tag-green {
      background: var(--wa-light);
      color: var(--wa-green);
    }

    .tag-amber {
      background: var(--amber-light);
      color: var(--amber);
    }

    .tag-rose {
      background: var(--rose-light);
      color: var(--rose);
    }

    .tag-indigo {
      background: var(--indigo-light);
      color: var(--indigo);
    }

    .tag-subtle {
      background: var(--card-subtle);
      color: var(--tx-dim);
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--tx-muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--bd);
      background: var(--card-subtle);
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--bd-subtle);
      font-size: 13px;
      color: var(--tx);
      vertical-align: middle;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(0, 0, 0, 0.015);
    }

    /* Kanban Board for Leads */
    .kanban {
      display: grid;
      grid-template-columns: repeat(5, minmax(220px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .kanban-col {
      background: var(--card-subtle);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 480px;
    }

    .kanban-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 13px;
      color: var(--tx);
      padding-bottom: 4px;
    }

    .kanban-card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--radius-sm);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* WhatsApp & Chat Simulator */
    .chat-layout {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      gap: 16px;
      height: 600px;
    }

    @media (max-width: 1080px) {
      .chat-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .chat-contacts {
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      background: var(--card);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .contact-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--bd-subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .contact-item:hover,
    .contact-item.active {
      background: var(--ac-light);
    }

    .chat-box {
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      background: var(--card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
    }

    .msg {
      max-width: 75%;
      padding: 9px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-bot {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--bd);
      color: var(--tx);
      border-bottom-left-radius: 3px;
    }

    .msg-patient {
      align-self: flex-end;
      background: var(--ac);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .msg-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 3px;
      text-align: right;
    }

    /* AI Hub Elements */
    .ai-badge {
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      color: #fff;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .ai-output-box {
      background: var(--card-subtle);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* Modals & Dialogs */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-content {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Slots Grid */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 8px;
      margin: 10px 0;
    }

    .slot-btn {
      padding: 8px 4px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--card);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .slot-btn.available {
      border-color: var(--ac);
      color: var(--ac);
      background: var(--ac-light);
    }

    .slot-btn.selected {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
    }

    .slot-btn.taken {
      background: var(--card-subtle);
      color: var(--tx-muted);
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* Toast */
    #toast-wrap {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 110;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast-msg {
      background: var(--tx);
      color: var(--bg);
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Receipt Print Styling */
    @media print {
      body * {
        visibility: hidden;
      }

      #printable-receipt,
      #printable-receipt * {
        visibility: visible;
      }

      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        border: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- Top Header -->
  <header>
    <div class="brand-wrap">
      <div class="brand-logo">🦷</div>
      <div class="brand-info">
        <h1 id="clinic-name-header">DentaDesk Dental Care</h1>
        <span id="doctor-name-header">Dental Clinic CRM & AI Assistant</span>
      </div>
    </div>
    <div class="top-actions" id="top-auth-actions">
      <!-- Injected via JS -->
    </div>
  </header>

  <!-- Navigation -->
  <nav id="main-nav"></nav>

  <!-- Main View Container -->
  <main id="app-viewport"></main>

  <!-- Modals & Toasts -->
  <div id="modal-container"></div>
  <div id="toast-wrap"></div>

  <script>
    /**
     * DentaDesk State & Engine
     */
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let TOKEN = sessionStorage.getItem('dentadesk_token');
    let STATE = null;
    let CURRENT_TAB = 'dash';
    let ACTIVE_CHAT_PHONE = null;
    let PATIENT_SEARCH_QUERY = '';
    let APPT_DATE_FILTER = '';
    let APPT_PATIENT_FILTER = 'ALL';
    let APPT_STATUS_FILTER = 'ALL';
    let APPT_SEARCH_QUERY = '';
    let THEME = localStorage.getItem('dentadesk_theme') || 'light';

    if (THEME === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    const TABS = {
      dash: { title: 'Dashboard', icon: '📊' },
      pts: { title: 'Patients', icon: '👥' },
      appts: { title: 'Appointments', icon: '📅' },
      leads: { title: 'Leads & Marketing', icon: '🎯' },
      wa: { title: 'WhatsApp & Bot Simulator', icon: '💬' },
      ai: { title: 'Dental AI Copilot', icon: '🤖' },
      inv: { title: 'Supplies', icon: '📦' },
      bill: { title: 'Billing & Invoices', icon: '💳', ownerOnly: true },
      team: { title: 'Settings & Team', icon: '⚙️', ownerOnly: true }
    };

    const K = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const lab = s => {
      if (!s) return '–';
      try {
        const p = String(s).split('-');
        if (p.length === 3) {
          const dt = new Date(+p[0], +p[1] - 1, +p[2]);
          if (!isNaN(dt.getTime())) return dt.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
        }
        const d = new Date(s);
        return isNaN(d.getTime()) ? s : d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
      } catch { return s; }
    };

    function toast(msg, type = 'info') {
      const wrap = $('#toast-wrap');
      const el = document.createElement('div');
      el.className = 'toast-msg';
      el.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⚠️' : '🔔'}</span> <span>${esc(msg)}</span>`;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function toggleTheme() {
      THEME = THEME === 'dark' ? 'light' : 'dark';
      localStorage.setItem('dentadesk_theme', THEME);
      if (THEME === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      render();
    }

    async function api(method, url, body) {
      const headers = { 'Content-Type': 'application/json' };
      if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
      const res = await fetch(url, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined
      });
      if (res.status === 401 && TOKEN) {
        logout();
        throw new Error('Unauthorized');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        toast(data.error || 'Request failed', 'error');
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    async function act(method, url, body, successToast) {
      try {
        const res = await api(method, url, body);
        if (successToast) toast(successToast, 'success');
        await refreshState();
        return res;
      } catch (e) {
        console.error(e);
      }
    }

    async function refreshState() {
      if (!TOKEN) return;
      try {
        STATE = await api('GET', '/api/bootstrap');
        render();
      } catch (err) {
        console.error('Refresh state failed', err);
      }
    }

    async function login() {
      const u = $('#login-user').value.trim();
      const p = $('#login-pass').value;
      try {
        const res = await api('POST', '/api/login', { username: u, password: p });
        TOKEN = res.token;
        sessionStorage.setItem('dentadesk_token', TOKEN);
        await refreshState();
      } catch (err) {
        $('#login-error').textContent = 'Invalid credentials. Check .env passwords.';
      }
    }

    function logout() {
      TOKEN = null;
      STATE = null;

    // Modal Manager
    function showModal(html) {
      $('#modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-content">${html}</div>
    </div>
  `;

    function closeModal() { $('#modal-container').innerHTML = ''; }

    // Helper: Patient name lookup
    const ptName = id => (STATE?.patients?.find(p => p.id === +id) || {}).name || `Patient #${id}`;

    // Helper: Open in native WhatsApp Web / App directly
    function openInWhatsApp(phone, text) {
      const cleanPh = String(phone || '').replace(/\D/g, '');
      if (!cleanPh) {
        toast('No valid phone number for WhatsApp', 'error');
        return;
      }
      const encodedText = encodeURIComponent(text || '');
      // Save in local chat log
      fetch(`/api/chats/${cleanPh}/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
        body: JSON.stringify({ text })
      }).catch(() => { });
      // Launch WhatsApp Web or mobile app
      window.open(`https://wa.me/${cleanPh}?text=${encodedText}`, '_blank');
    }

    // WhatsApp Connection & Live Test Diagnostics Modal
    async function openWhatsAppDiagnosticsModal() {
      const status = await api('GET', '/api/wa/status').catch(() => ({ live: false }));
      const userPhone = STATE.settings?.phone || '';
      showModal(`

      <h3 style="font-size:17px; font-weight:800;">📱 WhatsApp Connection & Live Messaging</h3>

    <div style="background:var(--card-subtle); padding:14px; border-radius:var(--radius-sm); font-size:12px; line-height:1.5; border-left:3px solid ${status.live ? 'var(--wa-green)' : 'var(--amber)'};">

    async function saveWhatsAppCredentials() {
      const waPhoneId = $('#wa-diag-phone-id').value.trim();
      const waToken = $('#wa-diag-token').value.trim();
      const notifyNumbers = $('#wa-diag-notify').value.trim();

      await act('PATCH', '/api/settings', {
        settings: { waPhoneId, waToken, notifyNumbers }
      }, 'WhatsApp credentials saved!');
      openWhatsAppDiagnosticsModal();
    }

    async function sendMetaTestPing() {
      const phone = $('#wa-diag-test-phone').value.trim();
      $('#wa-test-result').innerHTML = '<span style="color:var(--tx-muted);">Sending test ping to Meta Cloud API...</span>';
      try {
        const res = await api('POST', '/api/wa/test', { phone });
        if (res.success) {
          $('#wa-test-result').innerHTML = '<div style="color:var(--wa-green); font-weight:700;">✅ Test message sent successfully via Meta Cloud API! Check your WhatsApp.</div>';
          toast('Test WhatsApp message delivered!', 'success');
        } else {
          $('#wa-test-result').innerHTML = `
        <div style="color:var(--rose); background:var(--rose-light); padding:10px; border-radius:6px;">
          <b>Meta Delivery Diagnostic:</b><br>${esc(res.error || 'Failed')}
          ${!res.isConfigured ? '<div style="margin-top:6px; font-size:11px;">Enter WA_PHONE_ID and WA_TOKEN above to enable Cloud API, or use the green <b>Open wa.me</b> button to send via regular WhatsApp.</div>' : ''}
        </div>
      `;
        }
      } catch (err) {
        $('#wa-test-result').innerHTML = `<div style="color:var(--rose);">Error: ${esc(err.message)}</div>`;
      }
    }

      const lowStockCount = STATE.inventory.filter(i => i.qty <= i.min).length;
      const recallDueCount = STATE.metrics?.recallDue || 0;

      // Revenue calculation for owner
      const paidRev = STATE.invoices.filter(i => i.paid).reduce((s, i) => s + (i.amount || 0), 0);
      const unpaidRev = STATE.invoices.filter(i => !i.paid).reduce((s, i) => s + (i.amount || 0), 0);

        if (isNaN(vDate.getTime())) return false;
        const daysSince = Math.floor((Date.now() - vDate.getTime()) / 864e5);
        return daysSince >= (p.recallDays || STATE.settings?.recallDays || 180) &&
          (!p.recalledAt || Date.now() - p.recalledAt > 21 * 864e5) &&

      const defaultMsg = `Hi ${firstName}, it's time for your routine dental checkup & cleaning at DentaDesk! Preventive care keeps your smile healthy. Reply BOOK to pick a time, or call us. 🦷`;

      showModal(`

    // Patient Dossier & Full Schedule View Modal
    function openPatientDossierModal(patientId) {
      const p = STATE.patients.find(x => x.id === +patientId);
      if (!p) {
        toast('Patient record not found', 'error');
        return;
      }
      const todayStr = K(new Date());

      // All appointments for this patient
      const patientAppts = STATE.appointments
        .filter(a => a.patientId === p.id)
        .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

      const upcomingAppts = patientAppts.filter(a => a.status === 'Booked' && a.date >= todayStr);
      const pastAppts = patientAppts.filter(a => a.status !== 'Booked' || a.date < todayStr);

      // Invoices for this patient
      const patientInvoices = (STATE.invoices || []).filter(i => i.patientId === p.id);
      const totalBilled = patientInvoices.reduce((s, i) => s + (i.amount || 0), 0);
      const totalPaid = patientInvoices.filter(i => i.paid).reduce((s, i) => s + (i.amount || 0), 0);
      const balanceDue = totalBilled - totalPaid;

      // Recall status calculation
      let recallText = 'Up to date';
      let isOverdue = false;
      if (p.lastVisit) {
        const vDate = new Date(p.lastVisit.includes('T') ? p.lastVisit : p.lastVisit + 'T00:00');
        if (!isNaN(vDate.getTime())) {
          const daysSince = Math.floor((Date.now() - vDate.getTime()) / 864e5);
          const limit = p.recallDays || STATE.settings?.recallDays || 180;
          if (daysSince >= limit) {
            isOverdue = true;
            recallText = `Overdue (${daysSince - limit}d late)`;
          } else {
            recallText = `Checkup due in ${limit - daysSince} days`;
          }

        recallText = 'New patient / No visits recorded';

      showModal(`

                <div style="font-size: 13px; color: var(--tx-muted); margin-top: 2px;">

      </div>
      <div>
        <label style="font-size: 11px; font-weight: 700; color: var(--tx-muted);">SERVICE / TREATMENT</label>
        <input id="ninv-service" placeholder="e.g. Ceramic Crown + Root Canal" value="Consultation" style="margin-top: 4px;">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
          <label style="font-size: 11px; font-weight: 700; color: var(--tx-muted);">AMOUNT (₹) *</label>
          <input id="ninv-amount" type="number" value="1500" style="margin-top: 4px;">
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 700; color: var(--tx-muted);">PAYMENT STATUS</label>
          <select id="ninv-paid" style="margin-top: 4px;">
            <option value="false">Unpaid (Pending)</option>
            <option value="true">Paid in Full</option>
          </select>
        </div>
      </div>
      <div>
        <label style="font-size: 11px; font-weight: 700; color: var(--tx-muted);">PAYMENT METHOD</label>
        <select id="ninv-method" style="margin-top: 4px;">
          <option value="UPI">UPI / Google Pay</option>
          <option value="Cash">Cash</option>
          <option value="Card">Credit/Debit Card</option>
          <option value="Pending">Pending</option>
        </select>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewInvoice()">Create Invoice</button>
    </div>
  `);
    }

    async function submitNewInvoice() {
      const patientId = $('#ninv-patient').value;
      const service = $('#ninv-service').value.trim();
      const amount = $('#ninv-amount').value;
      const paid = $('#ninv-paid').value === 'true';
      const method = $('#ninv-method').value;
      if (!patientId || !amount) return;
      closeModal();
      await act('POST', '/api/invoices', { patientId, service, amount, paid, method }, 'Invoice created!');
    }

    async function markInvoicePaid(invoiceId) {
      const method = prompt('Payment method (UPI, Cash, Card):', 'UPI');
      if (method === null) return;
      await act('PATCH', `/api/invoices/${invoiceId}/pay`, { method: method || 'Cash' }, 'Payment recorded!');
    }

    function printReceipt(invoiceId) {
      const inv = STATE.invoices.find(x => x.id === invoiceId);
      if (!inv) return;
      const p = STATE.patients.find(x => x.id === inv.patientId);
      const set = STATE.settings || {};

      showModal(`
    <div id="printable-receipt" style="padding: 10px;">
      <div style="text-align: center; border-bottom: 2px dashed var(--bd); padding-bottom: 16px; margin-bottom: 16px;">
        <h2 style="font-size: 18px; font-weight: 800; color: var(--ac);">${esc(set.clinicName || 'DentaDesk Dental Care')}</h2>
        <div style="font-size: 12px; color: var(--tx-muted);">${esc(set.doctorName || 'Dental Specialists')}</div>
        <div style="font-size: 11px; color: var(--tx-muted);">${esc(set.address || '')} · Ph: +${esc(set.phone || '')}</div>
      </div>

      <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 14px;">
        <div>
          <b>PATIENT:</b> ${esc(p ? p.name : 'Walk-in')}<br>
          <b>PHONE:</b> ${esc(p ? p.phone : '–')}
        </div>
        <div style="text-align: right;">
          <b>INVOICE #:</b> ${inv.id}<br>
          <b>DATE:</b> ${new Date(inv.at).toLocaleDateString('en-IN')}
        </div>
      </div>

      <table style="width: 100%; border-collapse: collapse; margin-bottom: 16px;">
        <thead>
          <tr style="border-bottom: 1px solid var(--bd);">
            <th style="padding: 8px 0; font-size: 12px; text-align: left;">Treatment / Procedure</th>
            <th style="padding: 8px 0; font-size: 12px; text-align: right;">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="padding: 10px 0;">${esc(inv.service)}</td>
            <td style="padding: 10px 0; text-align: right; font-weight: 700;">₹${(inv.amount || 0).toLocaleString('en-IN')}</td>
          </tr>
        </tbody>
      </table>

      <div style="border-top: 1px solid var(--bd); padding-top: 12px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <b>STATUS:</b> <span class="tag ${inv.paid ? 'tag-green' : 'tag-rose'}">${inv.paid ? 'PAID IN FULL (' + (inv.method || 'Cash') + ')' : 'UNPAID'}</span>
        </div>
        <div style="font-size: 16px; font-weight: 800;">
          Total: ₹${(inv.amount || 0).toLocaleString('en-IN')}
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px; font-size: 11px; color: var(--tx-muted);">
        Thank you for choosing ${esc(set.clinicName || 'DentaDesk')}! Keep smiling brightly. 🦷
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
      <button class="btn" onclick="closeModal()">Close</button>
      <button class="btn" style="background:#25D366; color:#fff; border-color:#25D366;" onclick="openInWhatsApp('${p ? p.phone : ''}', 'Hi ${p ? p.name.split(' ')[0] : 'there'}! Here is your receipt from ${esc(set.clinicName || 'DentaDesk')} for ${esc(inv.service)}. Total: ₹${inv.amount} (${inv.paid ? 'PAID via ' + (inv.method || 'Cash') : 'PENDING'}). Thank you for visiting us! 🦷')">💬 Send on WhatsApp</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print Receipt</button>
    </div>
  `);
    }

    // 9. SETTINGS & PASSWORD ACTIONS
    async function saveClinicSettings() {
      const payload = {
        settings: {
          clinicName: $('#set-clinic-name').value.trim(),
          doctorName: $('#set-doctor-name').value.trim(),
          phone: $('#set-phone').value.trim(),
          address: $('#set-address').value.trim(),
          recallDays: +$('#set-recall-days').value || 180
        }
      };
      await act('PATCH', '/api/settings', payload, 'Clinic settings updated!');
    }

    async function savePriceList() {
      const prices = {};
      $$('.price-input').forEach(el => {
        prices[el.getAttribute('data-proc')] = +el.value || 0;
      });
      await act('PATCH', '/api/settings', { prices }, 'Price list saved!');
    }

    async function updateUserPassword() {
      const username = $('#pwd-user').value;
      const password = $('#pwd-new').value;
      if (!password || password.length < 8) {
        toast('Password must be 8+ characters', 'error');
        return;
      }
      await act('POST', '/api/users/password', { username, password }, 'Password updated successfully!');
      $('#pwd-new').value = '';
    }

    // Poll state every 8 seconds if tab is active
    setInterval(() => {
      if (TOKEN && !document.hidden && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) {
        refreshState();
      }
    }, 8000);

    // Initialize on page load
    if (TOKEN) {
      refreshState();
    } else {
      render();
    }
  </script>
</body>

</html>
